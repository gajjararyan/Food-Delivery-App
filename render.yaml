# Deploy on Render: New → Blueprint → connect this repo
# Do NOT set Root Directory to `backend` — the API imports ../lib from the monorepo root.
# Leave Root Directory empty and use the commands below.
services:
  - type: web
    name: gharkaswad-api
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend
    startCommand: npx --prefix backend tsx backend/src/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Do NOT hardcode PORT — Render injects it. App already uses process.env.PORT.
      # Set these secrets in the Render dashboard (never commit them):
      # EXPO_PUBLIC_SUPABASE_URL
      # EXPO_PUBLIC_SUPABASE_ANON_KEY
      # SUPABASE_SERVICE_ROLE_KEY
      # EXPO_PUBLIC_RAZORPAY_KEY_ID
      # RAZORPAY_KEY_SECRET
      - key: ALLOW_SANDBOX_CONFIRM
        value: "true"
